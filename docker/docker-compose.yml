# Docker Compose for local development
version: '3.8'

services:
  krishimind-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: krishimind-api
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount models and artifacts for development
      - ../models:/app/models:ro
      - ../artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

